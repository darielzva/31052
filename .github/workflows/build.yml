name: darielxz-external

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Seleccionar version de Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Compilar Proyecto (.app)
        run: |
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Copiar carpeta de parches completa a Documents
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1)
          
          # Asegurar que exista la carpeta Documents en la app
          mkdir -p "$APP_PATH/Documents"
          
          # Copia toda tu carpeta de parches (suponiendo que se llama 'MisParches' en tu repo) 
          # directamente a Documents/Patches de la app
          if [ -d "MisParches" ]; then
            cp -R "MisParches" "$APP_PATH/Documents/Patches"
            echo "Carpeta de parches copiada exitosamente."
          else
            echo "Advertencia: No se encontró la carpeta 'MisParches' en el repositorio."
          fi

      - name: Empaquetar en archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r darielxz-external.ipa Payload

      - name: Subir ejecutable IPA
        uses: actions/upload-artifact@v4
        with:
          name: darielxz-external-ipa
          path: darielxz-external.ipa
